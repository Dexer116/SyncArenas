name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      paper_api_version:
        description: 'paper-api version to build against (blank = the version pinned in pom.xml)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve the paper-api version
        id: paper
        run: |
          set -euo pipefail
          # The plugin is deliberately built against the OLDEST supported API, pinned in pom.xml,
          # so the release jar runs on every server from that version up.
          requested='${{ github.event.inputs.paper_api_version }}'
          version="$requested"
          if [ -z "$version" ]; then
            version=$(sed -n 's|.*<paper.api.version>\(.*\)</paper.api.version>.*|\1|p' pom.xml)
          fi
          echo "Using paper-api $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B -Dpaper.api.version=${{ steps.paper.outputs.version }} clean verify

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PAPER_API: ${{ steps.paper.outputs.version }}
        run: |
          set -euo pipefail
          jar=$(ls target/SyncArenas-*.jar)
          notes=.github/release-notes.md
          if [ -f "$notes" ]; then
            {
              echo
              echo "Built from \`${GITHUB_SHA::7}\` against \`paper-api ${PAPER_API}\`."
            } >> "$notes"
            gh release create "$TAG" "$jar" \
              --title "SyncArenas ${TAG#v}" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$jar" \
              --title "SyncArenas ${TAG#v}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
