name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      paper_api_version:
        description: 'paper-api version to build against (blank = newest matching the pom api version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve the paper-api version
        id: paper
        run: |
          set -euo pipefail
          requested='${{ github.event.inputs.paper_api_version }}'
          if [ -n "$requested" ]; then
            echo "version=$requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # plugin.yml's api-version doubles as the Minecraft version we target.
          prefix=$(sed -n 's|.*<plugin.api.version>\(.*\)</plugin.api.version>.*|\1|p' pom.xml)
          curl -sSfL --retry 3 \
            "https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml" \
            -o metadata.xml
          version=$(grep -o '<version>[^<]*</version>' metadata.xml \
            | sed -e 's|</\{0,1\}version>||g' \
            | grep "^${prefix}\." \
            | tail -1)
          if [ -z "$version" ]; then
            echo "No paper-api build published for $prefix" >&2
            grep -o '<version>[^<]*</version>' metadata.xml | tail -5 >&2
            exit 1
          fi
          echo "Using paper-api $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B -Dpaper.api.version=${{ steps.paper.outputs.version }} clean verify

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PAPER_API: ${{ steps.paper.outputs.version }}
        run: |
          set -euo pipefail
          jar=$(ls target/SyncArenas-*.jar)
          notes=.github/release-notes.md
          if [ -f "$notes" ]; then
            {
              echo
              echo "Built from \`${GITHUB_SHA::7}\` against \`paper-api ${PAPER_API}\`."
            } >> "$notes"
            gh release create "$TAG" "$jar" \
              --title "SyncArenas ${TAG#v}" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$jar" \
              --title "SyncArenas ${TAG#v}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
